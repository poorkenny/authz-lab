name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # Includes the randomized safety-invariant test: the guarded preset
      # must never serve a stale ALLOW.
      - name: Test
        run: go test -race ./...

      - name: Build server
        run: go build -o bin/authz-lab ./cmd/server

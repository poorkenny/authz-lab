# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: authz-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # Feature flags: see docs/FEATURES.md
    envVars:
      - key: FEATURE_CONTROLLED_CACHE_DELIVERY
        value: "true"

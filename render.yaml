# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: authz-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    # Feature flags: see docs/FEATURES.md
    envVars:
      - key: FEATURE_CONTROLLED_CACHE_DELIVERY
        value: "true"
      - key: FEATURE_STRATEGY_STORIES
        value: "true"
      - key: FEATURE_HAPPY_PATH_COMPARISON
        value: "true"
      - key: FEATURE_CLIENT_VERSION_TOKEN
        value: "true"
      - key: FEATURE_SQLITE_FAILURE
        value: "true"
      - key: FEATURE_LOG_REPLAY
        value: "true"
      - key: FEATURE_MULTI_POOL_INVALIDATION
        value: "true"
